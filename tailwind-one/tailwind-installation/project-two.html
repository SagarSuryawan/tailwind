<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project-Two</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <div class="w-screen h-screen flex">
        <img class="lg:block w-1/2" src="https://images.pexels.com/photos/2255935/pexels-photo-2255935.jpeg?auto=compress&cs=tinysrgb&w=600" alt="">
        <!-- login section -->
         <div class="flex flex-col justify-center items-center border w-1/2 lg:w-1/2">
            <div>
                <div class="text-xl font-bold text-center lg:text-left">
                    <span><i class="fa-solid fa-cow"></i></span>
                    <span>FarmMan</span>
                </div>
                <div class="mt-10 font-bold text-3xl lg:text-left">
                    <h2>Hello,</h2>
                    <h2>Welcome Back</h2>
                </div>
                <!-- loginForm -->
                 <form action="" class="mt-10 w-[80%] lg:w-[96] max-auto space-y-4">
                    <h4>Login to Maneage Your Account</h4>
                    <input type="email" placeholder="email" class="border w-full px-4 py-2">
                    <input type="password"placeholder="password" class="border w-full px-4 py-2">
                    <div class="text-blue-600 hover:text-blue-400">Forgot Your password ?</div>
                    <button class="w-full mt-2 bg-green-600 py-2 rounded text-white hover:bg-green-500 cursor-pointer">Login</button>

                    <div class="text-center mt-4 space-y-4">
                        <span>or</span>
                        <div class="flex justify-center items-center gap-8 mt-3 cursor-pointer  ">
                        <span><i class="fa-brands fa-facebook-f"></i></span>
                        <span><i class="fa-brands fa-google"></i></span>
                        <span><i class="fa-brands fa-instagram"></i></span>
                        </div>
                     </div>
                     <div class="text-center">Don't have an account ?
                        <span class="text-blue-600 hover:text-blue-400 cursor-pointer">Sign Up Here</span>
                     </div>
                 </form>
                
                 
            </div>
         </div>
    </div>
</body>
</html>
